/* ================= Assets：精灵图加载 + 占位图 ================= */
const FL=document.createElement('canvas'),FLg=FL.getContext('2d');
function placeholder(c){ // 程序生成彩色像素方块人，按配置的行/帧数排布
 const V=Object.values(c.animations),rows=Math.max(...V.map(a=>a.row))+1,cols=Math.max(...V.map(a=>a.frames)),fw=c.frameW,fh=c.frameH;
 const s=document.createElement('canvas');s.width=cols*fw;s.height=rows*fh;const q=s.getContext('2d'),k=fw/32;
 for(const n in c.animations){const a=c.animations[n];for(let f=0;f<a.frames;f++){
  const p=f/a.frames,sn=Math.sin(p*6.283);q.save();q.translate(f*fw+c.anchor.x,a.row*fh+c.anchor.y);q.scale(k,k);
  if(n=='die')q.scale(1+p*.3,1-p*.75);if(n=='hurt')q.rotate(-.2);
  const bob=n=='idle'?sn:n=='run'?-Math.abs(sn)*3:0,L=n=='run'?sn*4:0;
  q.fillStyle='#222';q.fillRect(-6+L,-8,5,8);q.fillRect(1-L,-8,5,8);
  q.fillStyle=c.color;q.fillRect(-7,-21+bob,14,14);q.fillRect(-5,-30+bob,10,9);
  q.fillStyle=c.c2||'#fc3';q.fillRect(-7,-11+bob,14,3);if(c.c2){q.fillRect(-7,-21+bob,3,10);q.fillRect(4,-21+bob,3,10)}
  q.fillStyle='rgba(255,255,255,.3)';q.fillRect(-7,-21+bob,14,3);q.fillRect(-5,-30+bob,10,2);
  q.fillStyle=c.c2||'#fff';q.fillRect(-4,-27+bob,3,3);q.fillRect(1,-27+bob,3,3);if(c.hn==1){q.fillRect(-6,-36+bob,2,7);q.fillRect(4,-36+bob,2,7)}if(c.hn==2)q.fillRect(-1,-38+bob,2,8);if(c.hn==3)q.fillRect(-7,-30+bob,14,2);
  const ext=n=='attack'?6+8*Math.sin(p*3.14):0,up=(n=='skill'||n=='ultimate')?6:0;
  q.fillStyle='#ddd';q.fillRect(7,-19+bob-up,4+ext,4);q.fillRect(-11,-19+bob-up,4,4);
  if(n=='ultimate'){q.fillStyle='rgba(255,255,160,'+(.25+.35*sn*sn)+')';q.fillRect(-12,-32,24,34)}
  q.restore()}}
 return s}
const Assets={cache:{},get(key,cfg){ // 加载失败/无文件时保留占位图
 if(this.cache[key])return this.cache[key];const e={img:placeholder(cfg)};this.cache[key]=e;
 if(cfg.embed&&!cfg.sprite){const i2=new Image();i2.onload=()=>{e.img=i2};i2.src=cfg.embed}
 if(cfg.sprite){const im=new Image();im.onload=()=>{e.img=im};im.onerror=()=>{if(cfg.embed){const i2=new Image();i2.onload=()=>{e.img=i2};i2.src=cfg.embed}};im.src=cfg.sprite}return e}};

/* ================= 动画系统 ================= */
class Anim{
 constructor(cfg,key){this.cfg=cfg;this.a=Assets.get(key,cfg);this.n='idle';this.t=0;this.f=0;this.last=-1;this.done=false;this.ev=null}
 play(n,force){if(this.n==n&&!force)return;this.n=n;this.t=0;this.f=0;this.last=-1;this.done=false}
 update(dt){const a=this.cfg.animations[this.n];this.t+=dt*a.fps;let f=Math.floor(this.t);
  if(a.loop)f%=a.frames;else if(f>=a.frames){f=a.frames-1;this.done=true}
  if(a.hit!=null&&f>=a.hit&&this.last<a.hit&&this.ev)this.ev(this.n); // 动画事件回调
  this.last=f;this.f=f}
 draw(x,y,flip,s,flash){const c=this.cfg,a=c.animations[this.n],fw=c.frameW,fh=c.frameH,sx=this.f*fw,sy=a.row*fh,dx=-c.anchor.x*s,dy=-c.anchor.y*s;
  g.save();g.translate(Math.round(x),Math.round(y));if(flip)g.scale(-1,1);
  if(flash){FL.width=fw;FL.height=fh;FLg.drawImage(this.a.img,sx,sy,fw,fh,0,0,fw,fh);FLg.globalCompositeOperation='source-atop';
   FLg.fillStyle=flash===true?'#fff':flash;FLg.fillRect(0,0,fw,fh);FLg.globalCompositeOperation='source-over';g.drawImage(FL,0,0,fw,fh,dx,dy,fw*s,fh*s)}
  else g.drawImage(this.a.img,sx,sy,fw,fh,dx,dy,fw*s,fh*s);
  g.restore()}}

const Snd={ctx:null,init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.bgm()}catch(e){}}
  if(this.ctx&&this.ctx.state=='suspended')this.ctx.resume()},
 tone(f,d,type,v,sl){if(!this.ctx||G.mute)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),n=this.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);
  n.gain.setValueAtTime(v*G.vol,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(this.ctx.destination);o.start(t);o.stop(t+d)},

function windUp(e,t,R,ux,uy){e.st='wind';e.tm=t;e.wt0=t;e.tgR=R;e.lx=ux*420;e.ly=uy*420;e.hitP=0}

function doAtk(e,ux,uy,d){const r=G.run,p=r.p,c=e.c,ai=c.ai,a=Math.atan2(uy,ux);e.st='atk';e.tm=.3;
 if(ai=='melee'||ai=='charger'){e.tm=ai=='charger'?.5:.25;if(ai=='charger'){e.lx*=1.8;e.ly*=1.8}e.hitP=0;return}
 if(ai=='ranged'){fire('e',e.x,e.y,a,260,c.dmg,7,'#f84',0,3);e.st='chase';e.cd=1.6;return}
 if(ai=='fan'){for(let i=-2;i<=2;i++)fire('e',e.x,e.y,a+i*.2,240,c.dmg,6,'#fc4',0,3);e.st='chase';e.cd=2;return}
 if(ai=='ring'){const o=rnd(0,6.28);for(let i=0;i<10;i++)fire('e',e.x,e.y,o+i*.628,170,c.dmg,6,'#6cf',0,4);e.st='chase';e.cd=2.4;return}
 if(ai=='sniper'){fire('e',e.x,e.y,a,520,c.dmg*1.6,6,'#f33',0,3);e.st='chase';e.cd=2.4;return}
 if(ai=='rain'){zone(p.x,p.y,55,1,c.dmg*1.5);for(let i=0;i<3;i++)zone(p.x+rnd(-110,110),p.y+rnd(-110,110),50,1.1,c.dmg*1.5);e.st='chase';e.cd=3;return}

 if(ai=='summon'){for(let i=0;i<2;i++)r.en.push(mkEnemy('grunt',cl(e.x+rnd(-50,50),80,W-80),cl(e.y+rnd(-50,50),80,H-80)));e.summ+=2;e.st='chase';e.cd=4;burst(e.x,e.y-20,14,'#c6f');return}
 const n2=e.ph==2; // Boss
 if(e.pat==0){const n=n2?20:12,o=rnd(0,6.28);for(let i=0;i<n;i++)fire('e',e.x,e.y,o+i/n*6.283,200,c.dmg,8,'#f4f',0,4)}
 else if(e.pat==1){const n=n2?7:3;for(let i=0;i<n;i++)fire('e',e.x,e.y,a+(i-(n-1)/2)*.22,300,c.dmg,8,'#f84',0,4)}
 else if(e.pat==3){for(let i=0;i<4;i++)zone(p.x+(i?rnd(-140,140):0),p.y+(i?rnd(-140,140):0),60,1.1,c.dmg*1.3)}
 else if(e.pat==4){const o=rnd(0,6.28),n=n2?24:16;for(let i=0;i<n;i++)fire('e',e.x,e.y,o+i*.55,150+i*8,c.dmg,7,'#fa4',0,4)}
 else{ring(e.x,e.y,120,'#f44',.5);G.shake=10;if(d<120+p.r)hurtP(c.dmg*1.5,a);
  if(n2){for(let i=0;i<12;i++)fire('e',e.x,e.y,i/12*6.283,170,c.dmg,8,'#f4f',0,4);
   if(r.en.length<6)for(let i=0;i<2;i++)r.en.push(mkEnemy('grunt',cl(e.x+rnd(-90,90),80,W-80),cl(e.y+rnd(-90,90),80,H-80)))}}
 e.tm=.4}
function eUpdate(e,dt){const r=G.run,p=r.p,c=e.c,ai=c.ai;e.flash-=dt;e.tm-=dt;e.cd-=dt;
 if(e.kx||e.ky){moveBy(e,e.kx*dt,e.ky*dt);e.kx*=.88;e.ky*=.88;if(Math.abs(e.kx)+Math.abs(e.ky)<8)e.kx=e.ky=0}
 if(e.z>0||e.vz){e.z+=e.vz*dt;e.vz-=900*dt;if(e.z<=0){e.z=0;e.vz=0}}
 if(e.st=='die'){e.anim.update(dt);if(e.anim.done&&e.tm<-.3)e.dead=1;return}
 const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,sp=c.speed*(e.ph==2?1.3:1);let an='idle';
 if(e.st!='atk')e.flip=dx<0;

 else if(e.st=='hurt'){an='hurt';if(e.tm<=0)e.st='chase'}

  if(p.hp<=0)an='idle';
  else if(ai=='melee'||ai=='bomb'||ai=='boss'||ai=='charger'){moveBy(e,ux*sp*dt,uy*sp*dt);const rng=ai=='boss'?260:ai=='bomb'?50:ai=='charger'?300:46;
   if(e.cd<=0&&d<rng){let t=.45,R=50;if(ai=='bomb'){t=.7;R=70}if(ai=='charger')t=.8;if(ai=='boss'){e.pat=(e.pat+1)%(c.pats||3);t=e.pat==2?.9:.7;R=e.pat==2?120:0}windUp(e,t,R,ux,uy)}}
  else{const k=d>260?1:d<170?-1:0;moveBy(e,ux*sp*k*dt-uy*sp*.4*dt,uy*sp*k*dt+ux*sp*.4*dt); // 保持距离并横移
   if(e.cd<=0&&d<520&&(ai=='ranged'||e.summ<4))windUp(e,ai=='summon'?.8:ai=='sniper'?1:.5,0,ux,uy)}}
 else if(e.st=='wind'){if(e.tm<=0)doAtk(e,ux,uy,d)}
 else if(e.st=='atk'){an='attack';
  if(ai=='melee'||ai=='charger'){moveBy(e,e.lx*dt,e.ly*dt);if(!e.hitP&&d<e.r+p.r+6){e.hitP=1;hurtP(c.dmg,Math.atan2(e.ly,e.lx))}}
  if(e.tm<=0){e.st='chase';e.cd=ai=='boss'?(e.ph==2?.8:1.5):1.4}}
 e.anim.play(an);e.anim.update(dt)}

function pUpdate(dt){const r=G.run,p=r.p,c=p.c,A=c.stats.attack;p.flash-=dt;p.inv-=dt;p.atkCd-=dt;p.skCd-=dt;p.shield-=dt;p.cmbT-=dt;
 if(p.act=='die'){p.anim.update(dt);if(p.anim.done&&!r.res){r.res='lose';r.endT=1.2}return}
 const[ax,ay]=Input.axis(),mv=Math.hypot(ax,ay)>.1,tg=nearest(p,700),att=Input.btn.atk||Input.k.j,mouse=!Input.m.touch;
 // 瞄准：自动模式=最近敌人，没有敌人时按住攻击则打向鼠标，否则沿移动方向；手动模式=鼠标（触屏则沿移动方向）
 if(G.auto){if(tg)p.aim=Math.atan2(tg.y-p.y,tg.x-p.x);else if(att&&mouse)p.aim=Math.atan2(Input.m.y-p.y+20,Input.m.x-p.x);else if(mv)p.aim=Math.atan2(ay,ax)}
 else if(mouse)p.aim=Math.atan2(Input.m.y-p.y+20,Input.m.x-p.x);else if(mv)p.aim=Math.atan2(ay,ax);
 // 朝向：攻击/放技能/静止时面向瞄准方向；其余情况（单纯移动）面向移动方向
 if(att||p.act||!mv)p.flip=Math.cos(p.aim)<0;else if(Math.abs(ax)>.1)p.flip=ax<0;
 if(p.dash){const d=p.dash;d.t-=dt;moveBy(p,d.vx*dt,d.vy*dt);burst(p.x,p.y-20,1,c.color,30);
  for(const e of r.en)if(!d.h.includes(e)&&e.st!='die'&&e.st!='spawn'&&Math.hypot(e.x-p.x,e.y-p.y)<e.r+26){d.h.push(e);hitE(e,A*c.skill.dmg,p.aim,320)}
  if(d.t<=0){p.dash=null;p.inv=Math.max(p.inv,.15)}}
 else if(p.act!='ultimate'){const sp=c.stats.speed*p.bf.spd*(p.chg>0?.5:p.act=='attack'?.75:1);moveBy(p,ax*sp*dt,ay*sp*dt)}
 if(p.kx||p.ky){moveBy(p,p.kx*dt,p.ky*dt);p.kx*=.85;p.ky*=.85}
 if(Input.tap.jump&&p.z==0){p.vz=300}
 if(p.z>0||p.vz){p.z+=p.vz*dt;p.vz-=900*dt;if(p.z<=0){p.z=0;p.vz=0}}

 if(p.act&&p.act!='die'&&p.act!='ultimate'&&p.anim.done)p.act=null;
 if(!p.act)p.anim.play(mv?'run':'idle');

function genRoom(i,boss){const m=[];for(let y=0;y<ROWS;y++){m[y]=[];for(let x=0;x<COLS;x++)m[y][x]=(x==0||y==0||x==COLS-1||y==ROWS-1)?1:0}
 const n=boss?3:ri(4,8);for(let k=0;k<n;k++){const x=ri(3,COLS-4),y=ri(2,ROWS-3);if(Math.abs(y-5)<2&&(x<6||x>COLS-7))continue;m[y][x]=1;if(Math.random()<.4&&x<COLS-5)m[y][x+1]=1}
 for(let y=4;y<=6;y++){m[y][COLS-1]=2;m[y][0]=i?3:1}   // 2=前进门(清房后开启) 3=身后封闭门
 return{m,boss,i,vis:0,wave:0,waves:boss?1:2+(i>1?1:0),cleared:0,wt:.8,hue:(G.stg.hue+i*7)%360}}
function startRun(){const n=G.stg.rooms,rooms=[];for(let i=0;i<n;i++)rooms.push(genRoom(i,i==n-1));
 G.run={p:mkPlayer(G.sel),rooms,ri:0,en:[],pk:[],kills:0,coins:0,time:0,res:null,endT:0};G.ult=null;G.fade=null;loadRoom(0)}
function loadRoom(i){const r=G.run,R=r.rooms[i];r.ri=i;G.room=R;R.vis=1;SOLID=solidAt;r.en=[];r.pk=[];PR.forEach(q=>q.a=0);PT=[];TX=[];G.fx=[];
 r.p.x=i?90:120;r.p.y=H/2;r.p.dash=null;G.ban={t0:G.tm,col:`hsl(${R.hue},70%,60%)`,s:R.boss?'⚠ BOSS · '+ENEMIES[G.stg.boss].name:G.stg.n.split(' · ')[1]+'  '+(i+1)+'/'+r.rooms.length};spawnWave()}
function spawnWave(){const r=G.run,R=G.room;R.wave++;const list=[];
 if(R.boss)list.push(G.stg.boss);
 else{const sp0=G.stg.pool,pool=sp0.slice(0,Math.min(sp0.length,2+Math.floor((R.i+R.wave-1)/2))),n=Math.min(10,2+R.i+R.wave);for(let i=0;i<n;i++)list.push(pool[ri(0,pool.length-1)])}
 for(const t of list){let x,y,k=0;do{x=rnd(110,W-110);y=rnd(110,H-110);k++}while((blocked(x,y,20)||Math.hypot(x-r.p.x,y-r.p.y)<220)&&k<60);
  if(R.boss){x=W-200;y=H/2}r.en.push(mkEnemy(t,x,y))}}
function clearRoom(){const r=G.run,R=G.room,p=r.p;R.cleared=1;Snd.sfx('pick');
 if(R.boss){r.res='win';r.endT=1.8;return}
 for(let y=4;y<=6;y++)R.m[y][COLS-1]=0;
 for(let i=0;i<ri(4,7);i++)drop(W/2,H/2,'coin');for(let i=0;i<2;i++)drop(W/2,H/2,'orb');
 if(Math.random()<.5)drop(W/2,H/2,'hp');if(Math.random()<.5)r.pk.push({x:W/2+60,y:H/2+40,t:'chest',z:0,vz:0,vx:0,vy:0});
 float(W/2,H/2-60,'ROOM CLEAR!','#ff0',true);startPick()}
function finish(){const r=G.run;G.coins+=r.coins;G.last={win:r.res=='win',kills:r.kills,coins:r.coins,time:r.time};Scene.go('result')}
function tickFx(dt){for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<f.d);
 for(const q of PT){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.t-=dt}PT=PT.filter(q=>q.t>0);
 for(const t of TX){t.y-=40*dt;t.t-=dt}TX=TX.filter(t=>t.t>0)}
function prUpdate(dt){const r=G.run;for(const q of PR){if(!q.a)continue;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
 if(q.life<=0||SOLID(q.x,q.y)){q.a=0;burst(q.x,q.y-q.z,3,q.col);continue}
 if(q.team=='p'){for(const e of r.en){if(e.st=='die'||e.st=='spawn'||q.h.includes(e))continue;
   if(Math.hypot(e.x-q.x,e.y-q.y)<e.r+q.r){q.h.push(e);hitE(e,q.dmg,Math.atan2(q.vy,q.vx),180);if(q.h.length>q.pierce){q.a=0;break}}}}
 else{const p=r.p;if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r){hurtP(q.dmg,Math.atan2(q.vy,q.vx));q.a=0}}}}
function pkUpdate(dt){const r=G.run,p=r.p;for(const k of r.pk){
 if(k.z>0||k.vz>0){k.z+=k.vz*dt;k.vz-=900*dt;moveBy({get x(){return k.x},set x(v){k.x=v},get y(){return k.y},set y(v){k.y=v},r:4},k.vx*dt,k.vy*dt);if(k.z<=0){k.z=0;k.vz=0;k.vx=k.vy=0}}
 const d=Math.hypot(p.x-k.x,p.y-k.y);
 if((k.t=='coin'||k.t=='orb')&&d<90&&k.z==0){k.x+=(p.x-k.x)/d*320*dt;k.y+=(p.y-k.y)/d*320*dt}
 if(d<24&&p.hp>0){let used=1;if(k.t=='portal'||k.t=='bchest'||k.t=='shop'||k.t=='altar'){if(special(k))k.gone=1;continue}
  if(k.t=='coin'){r.coins+=5;Snd.sfx('pick')}
  else if(k.t=='orb'){p.en=Math.min(100,p.en+10);Snd.sfx('pick')}
  else if(k.t=='hp'){if(p.hp>=p.maxhp)used=0;else{p.hp=Math.min(p.maxhp,p.hp+40);float(p.x,p.y-60,'+40','#4f4');Snd.sfx('pick')}}
  else if(k.t=='chest'){for(let i=0;i<5;i++)drop(k.x,k.y,'coin');drop(k.x,k.y,'orb');Snd.sfx('boom');burst(k.x,k.y-10,12,'#fc4')}
  if(used)k.gone=1}}
 r.pk=r.pk.filter(k=>!k.gone)}

 else{g.fillStyle=k.col;g.fillRect(x-16,y-12,32,24);g.fillStyle='rgba(255,255,255,.3)';g.fillRect(x-16,y-12,32,6);txt(k.lab,x,y-30,12,'#fff','center');txt('● '+k.price,x,y+26,12,'#fd0','center')}}
function minimap(){const r=G.run,C={start:'#8cf',treasure:'#fd0',shop:'#4f4',altar:'#c6f',boss:'#f44'},xs=r.rooms.map(R=>R.gx),ys=r.rooms.map(R=>R.gy),x0=Math.min(...xs),y0=Math.min(...ys),w=(Math.max(...xs)-x0+1)*24,h=(Math.max(...ys)-y0+1)*18,ox=W-16-w,oy=16;
 g.fillStyle='rgba(8,6,24,.6)';g.fillRect(ox-6,oy-6,w+10,h+10);
 r.rooms.forEach((R,i)=>{if(!(R.vis||R.dd.some(d=>r.rooms[d.to].vis)))return;const x=ox+(R.gx-x0)*24,y=oy+(R.gy-y0)*18;g.fillStyle='#000';g.fillRect(x-1,y-1,22,16);
  g.fillStyle=R.vis?(C[R.type]||`hsl(${R.hue},50%,${R.cleared?45:30}%)`):'#333';g.fillRect(x,y,20,14);if(!R.vis)txt('?',x+10,y+8,10,'#999','center');if(i==r.ri){g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(x,y,20,14)}})}
const hud1=hud;hud=function(){hud1();minimap()};
let lastT=performance.now(),acc=0;const STEP=1/60;
function loop(t){let d=(t-lastT)/1000;lastT=t;if(d>.1)d=.1;acc+=d;
 while(acc>=STEP){G.tm+=STEP;S[Scene.cur].update(STEP);Input.tap={};acc-=STEP}
 g.imageSmoothingEnabled=false;g.clearRect(0,0,W,H);S[Scene.cur].draw();if(Scene.cur!='dungeon')UI.draw();requestAnimationFrame(loop)}
Scene.go('lobby');requestAnimationFrame(loop);
</script></body></html>
